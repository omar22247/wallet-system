spring:
  application:
    name: gateway

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 3s
          routes:
            - id: auth-login
              order: -1
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientKeyResolver}"

            - id: auth-service
              order: 0
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientKeyResolver}"

gateway:
  jwt:
    issuer: wallet-auth-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read_only
