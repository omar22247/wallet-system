spring:
  application:
    name: gateway

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 10S
          routes:
            - id: auth-register-start
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              order: -1
              predicates:
                - Path=/api/auth/register/start
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 500
                    redis-rate-limiter.requestedTokens: 50

            - id: auth-register-complete
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              order: -1
              predicates:
                - Path=/api/auth/register/complete
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 450
                    redis-rate-limiter.requestedTokens: 30

            - id: auth-forgot-password
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              order: -1
              predicates:
                - Path=/api/auth/forgot-password
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 500
                    redis-rate-limiter.requestedTokens: 50

            - id: auth-reset-password
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              order: -1
              predicates:
                - Path=/api/auth/reset-password
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 450
                    redis-rate-limiter.requestedTokens: 30
            - id: auth-login
              order: -1
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 50
                    redis-rate-limiter.requestedTokens: 5
                    key-resolver: "#{@clientKeyResolver}"
            - id: auth-user-lookup
              order: -1
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/users/lookup
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 2
                    key-resolver: "#{@clientKeyResolver}"

            - id: auth-service
              order: 0
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@clientKeyResolver}"
            - id: wallet-service
              uri: ${WALLET_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/wallets/**, /api/admin/wallets/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@clientKeyResolver}"
gateway:
  jwt:
    issuer: wallet-auth-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

